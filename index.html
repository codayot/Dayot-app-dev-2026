<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Weekend To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scene">

    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>

    <div class="note">

      <div class="note-topbar">
        <span class="topbar-left">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 4 L7 12 L15 20" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          All iCloud
        </span>
        <span class="topbar-right">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3v12M8 7l4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg>
        </span>
      </div>

      <p class="note-meta">Edited just now</p>

      <h1 class="note-title">Weekend To-Do List</h1>


      <form id="todoForm" class="add-row">
        <span class="check-circle check-circle--ghost"></span>
        <input type="text" id="taskInput" placeholder="Add a to-do..." autocomplete="off" />
        <button type="submit" class="add-btn" aria-label="Add task">+</button>
      </form>
      <p id="errorMsg" class="error" role="alert" aria-live="polite"></p>

      <ul id="taskList" class="task-list"></ul>

      <p id="emptyMsg" class="empty">Nothing here yet — add your first to-do above.</p>

      <button id="clearAllBtn" type="button" class="clear-all">Clear All</button>


      <div class="note-bottombar">
        <svg viewBox="0 0 24 24" width="20" height="20" class="active"><circle cx="5" cy="7" r="1.8" fill="currentColor"/><path d="M9 7h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="5" cy="15" r="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 15h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="7" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 7l1.5-2.5h5L16 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 14.5 12 8l2.5 6.5M10.2 12.6h3.6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 20l1-4.2L14.6 6.2a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19 4 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
